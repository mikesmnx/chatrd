[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatrd-worker"
version = "0.1.1"
description = "Local Telegram worker for ChatRD"
requires-python = ">=3.11"
dependencies = [
  "telethon>=1.40,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7"
]
build = [
  "pyinstaller>=6.14,<7"
]

[project.scripts]
chatrd-worker = "chatrd_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["chatrd_worker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
